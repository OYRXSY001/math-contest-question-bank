{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="第1至17届全国大学生数学竞赛非数学A类真题与详细解析">
  <title>{% block title %}非数学A类真题库{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'katex.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  <script>
    // 主题预加载（防止页面闪烁）
    (function(){
      try{
        var t=localStorage.getItem('holo-theme')||'auto';
        var e=t==='auto'?(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;
        document.documentElement.setAttribute('data-theme',e);
      }catch(_){}
    })();
  </script>
</head>
<body>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <nav class="navbar border-bottom sticky-top" aria-label="主导航">
    <div class="container site-container">
      <a class="navbar-brand" href="{% url 'home' %}">◈ 非数学A类真题库</a>
      <div style="flex:1"></div>
      <a href="{% url 'paper-list' %}">真题库</a>
      {% if user.is_authenticated %}
        <a href="{% url 'favorites' %}">收藏</a>
        <a href="{% url 'wrong-questions' %}">错题</a>
        <form method="post" action="{% url 'accounts:logout' %}" class="m-0">
          {% csrf_token %}<button class="btn btn-link p-0" type="submit">退出</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}">登录</a>
      {% endif %}
      <button class="theme-toggle" type="button" aria-label="切换主题" title="切换主题">🌙</button>
    </div>
  </nav>

  <main class="container site-container py-4">
    {% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'js/theme.js' %}"></script>
  <script src="{% static 'js/particles.js' %}" defer></script>
  <script defer src="{% static 'katex.min.js' %}"></script>
  <script defer src="{% static 'contrib/auto-render.min.js' %}"></script>
  <script defer src="{% static 'js/math.js' %}"></script>
</body>
</html>
